backend:
  name: github
  repo: yang7834/yang7834.github.io
  branch: main
  auth_methods: [token]

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: blog
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: title, widget: string }
      - { label: "网址标识", name: slug, widget: string, hint: "文章网址最后一段，用小写英文或拼音、短横线连接，例如 hello-world" }
      - { label: "简介", name: description, widget: string }
      - { label: "日期", name: date, widget: datetime, format: "YYYY-MM-DD", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "标签", name: tags, widget: list, default: [], required: false }
      - { label: "封面图", name: cover, widget: image, required: false }
      - { label: "正文", name: body, widget: markdown }
