backend:
  name: github
  repo: yang7834/yang7834.github.io
  branch: main
  auth_methods: [token]

media_folder: "public/images"
public_folder: "/images"

collections:
  - name: blog
    label: "博客文章"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: title, widget: string }
      - { label: "网址标识", name: slug, widget: string, hint: "文章网址最后一段，只能用小写英文、数字和短横线，例如 hello-world", pattern: ["^[a-z0-9]+(?:-[a-z0-9]+)*$", "只能用小写英文、数字和短横线（-）"] }
      - { label: "简介", name: description, widget: string }
      - { label: "发布时间", name: date, widget: datetime, format: "YYYY-MM-DD HH:mm", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "置顶", name: sticky, widget: boolean, default: false, required: false, hint: "勾选后这篇文章会排在首页最前面" }
      - { label: "分类", name: category, widget: string, required: false, hint: "例如：技术 / 随笔 / 生活，留空则归入未分类" }
      - { label: "标签", name: tags, widget: list, default: [], required: false }
      - { label: "封面图", name: cover, widget: image, required: false }
      - { label: "正文", name: body, widget: markdown }
  - name: moments
    label: "动态"
    folder: "src/content/moments"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "发布时间", name: date, widget: datetime, format: "YYYY-MM-DD HH:mm", date_format: "YYYY-MM-DD", time_format: "HH:mm" }
      - { label: "置顶", name: sticky, widget: boolean, default: false, required: false }
      - { label: "内容", name: body, widget: text }
  - name: links
    label: "友链"
    folder: "src/content/links"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "站点名称", name: name, widget: string }
      - { label: "站点链接", name: url, widget: string }
      - { label: "头像链接", name: avatar, widget: image, required: false }
      - { label: "站点描述", name: description, widget: string, required: false }
  - name: photos
    label: "相册"
    folder: "src/content/photos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "标题", name: title, widget: string }
      - { label: "图片", name: image, widget: image }
      - { label: "描述", name: description, widget: string, required: false }
  - name: anime
    label: "追番"
    folder: "src/content/anime"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "番剧名", name: title, widget: string }
      - { label: "状态", name: status, widget: select, options: ["想看", "在看", "看完"], default: "想看" }
      - { label: "简介", name: description, widget: string, required: false }
  - name: bookmarks
    label: "书签导航"
    folder: "src/content/bookmarks"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "名称", name: name, widget: string }
      - { label: "链接", name: url, widget: string }
      - { label: "描述", name: description, widget: string, required: false }
  - name: site
    label: "站点设置"
    files:
      - name: settings
        label: "基本设置"
        file: "src/data/site.json"
        fields:
          - { label: "博客名", name: title, widget: string }
          - { label: "昵称", name: name, widget: string, required: false, hint: "头像下面显示的名字" }
          - { label: "副标题", name: subtitle, widget: string }
          - { label: "个人简介", name: bio, widget: string }
          - { label: "头像", name: avatar, widget: image }
          - { label: "背景图", name: background, widget: image }
          - { label: "建站日期", name: created, widget: string }
          - { label: "公告", name: notice, widget: text }
          - label: "社交链接"
            name: social
            widget: object
            fields:
              - { label: "GitHub", name: github, widget: string }
              - { label: "Bilibili", name: bilibili, widget: string }
              - { label: "抖音", name: douyin, widget: string }
          - label: "音乐"
            name: music
            widget: object
            fields:
              - { label: "歌名", name: title, widget: string }
              - { label: "歌手", name: artist, widget: string }
              - { label: "音频文件", name: audio, widget: string }
              - { label: "封面图", name: cover, widget: string }
